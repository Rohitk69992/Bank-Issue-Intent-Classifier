<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Prediction History
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>
            Prediction History
        </h1>

        <table>

            <tr>

                <th>ID</th>

                <th>Query</th>

                <th>Intent</th>

                <th>Confidence</th>

                <th>Timestamp</th>

            </tr>

            {% for row in records %}

            <tr>

                <td>{{ row[0] }}</td>

                <td>{{ row[1] }}</td>

                <td>{{ row[3] }}</td>

                <td>{{ row[4] }}</td>

                <td>{{ row[5] }}</td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
